<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery with Zoom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .gallery img:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 28px rgba(0,0,0,0.25);
        }

        /* Modal overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }

        /* Close button */
        .modal .close {
            position: absolute;
            top: 25px;
            right: 40px;
            font-size: 48px;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
            font-weight: 300;
            line-height: 1;
        }
        .modal .close:hover {
            color: #ccc;
            transform: rotate(90deg);
        }

        /* Navigation arrows */
        .modal .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            color: #fff;
            background: rgba(255,255,255,0.15);
            padding: 12px 18px;
            border-radius: 50%;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            z-index: 10;
            font-weight: 300;
        }
        .modal .nav:hover {
            background: rgba(255,255,255,0.35);
        }
        .modal .prev { left: 20px; }
        .modal .next { right: 20px; }

        /* Image wrapper (for panning) */
        .modal-image-wrapper {
            width: 80%;
            max-width: 1000px;
            height: 70vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 8px;
            background: #111;
            touch-action: none; /* prevent touch scroll interference */
        }
        .modal-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: grab;
            transition: transform 0.1s ease;
            transform: scale(1) translate(0px, 0px);
            will-change: transform;
        }
        .modal-image-wrapper img:active {
            cursor: grabbing;
        }

        /* Zoom controls */
        .zoom-controls {
            display: flex;
            gap: 18px;
            align-items: center;
            margin-top: 20px;
            background: rgba(0,0,0,0.6);
            padding: 12px 28px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
        }
        .zoom-controls button {
            background: #fff;
            border: none;
            width: 40px;
            height: 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            color: #222;
        }
        .zoom-controls button:hover {
            background: #ddd;
            transform: scale(1.05);
        }
        .zoom-controls span {
            color: #fff;
            font-size: 18px;
            min-width: 60px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .image-counter {
            color: rgba(255,255,255,0.7);
            font-size: 16px;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .modal-image-wrapper {
                width: 95%;
                height: 55vh;
            }
            .modal .nav {
                font-size: 30px;
                padding: 8px 12px;
            }
            .modal .prev { left: 8px; }
            .modal .next { right: 8px; }
            .modal .close {
                top: 12px;
                right: 18px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

<h1>Karakunku Farm Solar Enterprise</h1>

<div class="gallery" id="imageGallery">
    <!-- All 7 images will be injected by JavaScript -->
</div>

<!-- Modal -->
<div class="modal" id="imageModal">
    <span class="close" id="closeModal">&times;</span>
    <span class="nav prev" id="prevImage">&#10094;</span>
    <span class="nav next" id="nextImage">&#10095;</span>

    <div class="modal-image-wrapper" id="modalWrapper">
        <img id="modalImage" src="" alt="Zoomable image">
    </div>

    <div class="zoom-controls">
        <button id="zoomOutBtn">−</button>
        <span id="zoomLevelDisplay">100%</span>
        <button id="zoomInBtn">+</button>
    </div>
    <div class="image-counter" id="imageCounter">1 / 7</div>
</div>

<script>
    (function() {
        // ----- Image Data (All 7 karakunkufarmsolarenterprise URLs) -----
        const images = [
            "https://github.com/karakunkufarmsolarenterprise/.co.gm/blob/main/IMG-20260813-WA0002.jpg?raw=true",
            "https://github.com/karakunkufarmsolarenterprise/.co.gm/blob/main/IMG-20260813-WA0001.jpg?raw=true",
            "https://github.com/karakunkufarmsolarenterprise/.co.gm/blob/main/IMG-20260701-WA0005.jpg?raw=true",
            "https://github.com/karakunkufarmsolarenterprise/.co.gm/blob/main/IMG-20260331-WA0031.jpg?raw=true",
            "https://github.com/karakunkufarmsolarenterprise/.co.gm/blob/main/IMG-20260331-WA0030.jpg?raw=true",
            "https://github.com/karakunkufarmsolarenterprise/.co.gm/blob/main/IMG-20260331-WA0029.jpg?raw=true",
            "https://github.com/karakunkufarmsolarenterprise/.co.gm/blob/main/IMG-20260813-WA0012.jpg?raw=true"
        ];

        // ----- DOM references -----
        const gallery = document.getElementById('imageGallery');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const modalWrapper = document.getElementById('modalWrapper');
        const closeBtn = document.getElementById('closeModal');
        const prevBtn = document.getElementById('prevImage');
        const nextBtn = document.getElementById('nextImage');
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
        const imageCounter = document.getElementById('imageCounter');

        let currentIndex = 0;

        // ----- Zoom & Pan state -----
        let scale = 1;
        let posX = 0;
        let posY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let lastPosX = 0;
        let lastPosY = 0;

        // ----- Render gallery thumbnails -----
        function renderGallery() {
            gallery.innerHTML = '';
            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Image ${index + 1}`;
                img.loading = 'lazy';
                img.addEventListener('click', () => openModal(index));
                gallery.appendChild(img);
            });
        }

        // ----- Open Modal -----
        function openModal(index) {
            currentIndex = index;
            updateModalImage();
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // prevent scroll
            resetZoomAndPan();
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ----- Update image src + counter -----
        function updateModalImage() {
            modalImg.src = images[currentIndex];
            imageCounter.textContent = `${currentIndex + 1} / ${images.length}`;
        }

        // ----- Reset zoom/pan -----
        function resetZoomAndPan() {
            scale = 1;
            posX = 0;
            posY = 0;
            applyTransform();
            zoomLevelDisplay.textContent = '100%';
        }

        // ----- Apply transform to image -----
        function applyTransform() {
            modalImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        // ----- Zoom in/out -----
        function zoomIn() {
            scale = Math.min(scale * 1.2, 5); // max zoom 5x
            zoomLevelDisplay.textContent = Math.round(scale * 100) + '%';
            applyTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.2, 0.3); // min zoom 0.3x
            zoomLevelDisplay.textContent = Math.round(scale * 100) + '%';
            applyTransform();
        }

        // ----- Navigation -----
        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateModalImage();
            resetZoomAndPan();
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            updateModalImage();
            resetZoomAndPan();
        }

        // ----- Mouse wheel zoom on modal wrapper -----
        modalWrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -1 : 1;
            if (delta > 0) zoomIn();
            else zoomOut();
        }, { passive: false });

        // ----- Drag to pan -----
        modalImg.addEventListener('mousedown', (e) => {
            if (scale === 1) return; // no pan needed at default zoom
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            lastPosX = posX;
            lastPosY = posY;
            modalImg.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            posX = lastPosX + dx;
            posY = lastPosY + dy;
            applyTransform();
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                modalImg.style.cursor = 'grab';
            }
        });

        // Touch support for mobile panning
        let touchStartX = 0, touchStartY = 0;
        let touchLastX = 0, touchLastY = 0;
        modalImg.addEventListener('touchstart', (e) => {
            if (scale === 1) return;
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchLastX = posX;
            touchLastY = posY;
        }, { passive: true });

        modalImg.addEventListener('touchmove', (e) => {
            if (scale === 1) return;
            e.preventDefault();
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            posX = touchLastX + dx;
            posY = touchLastY + dy;
            applyTransform();
        }, { passive: false });

        // ----- Event listeners for buttons -----
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        prevBtn.addEventListener('click', prevImage);
        nextBtn.addEventListener('click', nextImage);
        zoomInBtn.addEventListener('click', zoomIn);
        zoomOutBtn.addEventListener('click', zoomOut);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); }
            if (e.key === '-') { e.preventDefault(); zoomOut(); }
        });

        // ----- Initialize -----
        renderGallery();

        // Ensure the first image is loaded into modal template (just in case)
        modalImg.src = images[0];

        console.log('Gallery ready! Click any image to zoom and pan.');
    })();
</script>

</body>
</html>
